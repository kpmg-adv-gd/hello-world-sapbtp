name: Deploy to Dev (Cloud Foundry)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CI-CD

    steps:
      - name: 🔄 Checkout codice
        uses: actions/checkout@v4

      - name: Usa manifest per ambiente Dev
        run: cp manifest-dev.yml manifest.yml


      - name: 🔧 Installa cf CLI via dpkg
        run: |
          echo "📦 Scarico pacchetto Debian cf CLI..."
          curl -L "https://packages.cloudfoundry.org/stable?release=debian64" -o cf.deb
          sudo dpkg -i cf.deb
          cf version

      - name: 🔐 Login su Cloud Foundry
        run: |
          set -e
          echo "🌐 API endpoint: ${{ secrets.CF_API }}"
          echo "👤 Login con utente: ${{ secrets.CF_USERNAME }}"
          cf login -a '${{ secrets.CF_API }}' -u '${{ secrets.CF_USERNAME }}' -p '${{ secrets.CF_PASSWORD }}' -o '${{ secrets.CF_ORG }}' -s '${{ secrets.CF_SPACE_DEV }}'

      - name: 🚀 Deploy su ambiente Dev
        run: |
          set -e
          echo "📂 Lista file in workspace:"
          ls -la
          echo "📦 Avvio cf push..."
          cf push --var ENV=dev