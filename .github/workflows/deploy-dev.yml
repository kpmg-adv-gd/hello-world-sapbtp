name: Deploy to Dev (Cloud Foundry)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout codice
        uses: actions/checkout@v4

      - name: 🔧 Setup cf CLI
        run: |
          echo "📦 Scarico la CLI di Cloud Foundry..."
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary" -o cf
          chmod +x cf
          sudo mv cf /usr/local/bin/cf
          cf version

      - name: 🔐 Login su Cloud Foundry
        run: |
          set -e
          echo "🌐 API endpoint: ${{ secrets.CF_API }}"
          echo "👤 Login con utente: ${{ secrets.CF_USERNAME }}"
          cf api "${{ secrets.CF_API }}" -v
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}" -v
          cf target -o "${{ secrets.CF_ORG }}" -s "${{ secrets.CF_SPACE_DEV }}" -v

      - name: 🚀 Deploy su ambiente Dev
        run: |
          set -e
          echo "📂 Lista file in workspace:"
          ls -la
          echo "📦 Avvio cf push..."
          cf push --var ENV=dev -v
